name: Publish planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: unzip planner-source.zip -d app
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          NEXT_PUBLIC_BASE_PATH: /five-tasks
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
